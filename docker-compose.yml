services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mock_tools
      POSTGRES_USER: mock_tools
      POSTGRES_PASSWORD: mock_tools
    ports:
      - "35432:5432"
    volumes:
      - mock_third_party_postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mock_tools -d mock_tools"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      PORT: "38080"
      DATABASE_URL: postgres://mock_tools:mock_tools@postgres:5432/mock_tools
      AUTH_BEARER_TOKEN: ${AUTH_BEARER_TOKEN:-mock-tool-token}
      AUTH_API_KEY: ${AUTH_API_KEY:-mock-tool-api-key}
      ROUTE_AUTH_CONFIG_PATH: /app/config/routes.json
      UPSTREAM_EXTERNAL_ORDERS_URL: ${UPSTREAM_EXTERNAL_ORDERS_URL:-http://139.162.40.219:3000/api/external-orders}
      UPSTREAM_EXTERNAL_ORDERS_TIMEOUT_MS: ${UPSTREAM_EXTERNAL_ORDERS_TIMEOUT_MS:-5000}
      VINLINK_ASSISTANT_MODE: ${VINLINK_ASSISTANT_MODE:-mock}
      VINLINK_ASSISTANT_API_BASE_URL: ${VINLINK_ASSISTANT_API_BASE_URL:-https://apigwdev.taixe247.vn}
      VINLINK_ASSISTANT_USERNAME: ${VINLINK_ASSISTANT_USERNAME:-ai_cskh}
      VINLINK_ASSISTANT_PASSWORD: ${VINLINK_ASSISTANT_PASSWORD:-}
      VINLINK_ASSISTANT_ACCESS_TOKEN: ${VINLINK_ASSISTANT_ACCESS_TOKEN:-}
      VINLINK_ASSISTANT_DEFAULT_SERVICE_ID: ${VINLINK_ASSISTANT_DEFAULT_SERVICE_ID:-10}
      VINLINK_ASSISTANT_TIMEOUT_MS: ${VINLINK_ASSISTANT_TIMEOUT_MS:-5000}
    ports:
      - "38080:38080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mock_third_party_postgres:
